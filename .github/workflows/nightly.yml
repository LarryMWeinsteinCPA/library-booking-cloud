name: Nightly library booking check

on:
  # GitHub's own `schedule:` trigger is intentionally NOT used here. It's documented as
  # best-effort, and in practice proved unreliable at any interval we tried — including once
  # confirmed, via a two-week gap analysis of run timestamps, to silently run at 2-5+ hour
  # intervals instead of the configured every-5-minutes. That's what caused a real missed
  # booking window on 2026-09-08.
  #
  # Instead, an external scheduler (cron-job.org) calls this workflow's `workflow_dispatch` API
  # endpoint directly, every 5 minutes from 12:01-2:56 AM in the America/Chicago timezone (so it
  # also self-adjusts for Daylight Saving Time — no manual cron edits needed twice a year).
  #
  # This is safe and cheap regardless of trigger source: booking_automation.py's --check-only
  # mode (below) does a lightweight Supabase read and exits in ~1-2 seconds when nothing is due
  # — true for the overwhelming majority of these runs — without ever installing or launching a
  # browser. Only the rare run that actually finds something due pays the cost of installing
  # Chromium and doing the real booking flow. Each individual booking still only gets ONE real
  # attempt per day regardless of how many times this fires (enforced in booking_automation.py).
  workflow_dispatch: {}

concurrency:
  group: nightly-booking-run
  cancel-in-progress: false

jobs:
  run-booking-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check whether anything is due
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIBRARY_CARD_NUMBER: ${{ secrets.LIBRARY_CARD_NUMBER }}
          LIBRARY_PIN: ${{ secrets.LIBRARY_PIN }}
        run: python booking_automation.py --check-only >> "$GITHUB_OUTPUT"

      - name: Install Chromium (only if something is actually due)
        if: steps.check.outputs.actionable == 'true'
        run: playwright install --with-deps chromium

      - name: Run booking check
        if: steps.check.outputs.actionable == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIBRARY_CARD_NUMBER: ${{ secrets.LIBRARY_CARD_NUMBER }}
          LIBRARY_PIN: ${{ secrets.LIBRARY_PIN }}
        run: python booking_automation.py
